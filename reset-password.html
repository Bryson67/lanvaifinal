<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Lanvai Institution</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #0e0a1a 0%, #1a142b 100%);
            min-height: 100vh;
            color: #f0ecf7;
            font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-container { width: 100%; max-width: 480px; padding: 1.5rem; }
        .auth-card {
            background: rgba(40, 30, 65, 0.35);
            border: 1px solid rgba(160, 120, 200, 0.08);
            border-radius: 24px;
            padding: 2rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        .auth-logo { text-align: center; margin-bottom: 1.5rem; }
        .auth-logo h2 { color: #f2ecff; font-weight: 700; }
        .auth-logo h2 span { color: #f59e0b; }
        .auth-logo p { color: #7a6a94; font-size: 0.85rem; }
        .form-control {
            background: rgba(12, 8, 24, 0.5);
            border: 1px solid rgba(180, 150, 220, 0.15);
            border-radius: 12px;
            color: #f0eaff;
            padding: 0.7rem 1rem;
            transition: 0.25s;
        }
        .form-control:focus {
            border-color: #f59e0b;
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.15);
            color: #f0eaff;
        }
        .form-control::placeholder { color: #7a6a94; }
        .form-label { color: #b8aad0; font-weight: 500; font-size: 0.85rem; }
        .btn-auth {
            width: 100%;
            padding: 0.7rem;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 1rem;
            transition: 0.3s;
            cursor: pointer;
        }
        .btn-auth.btn-reset {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
        }
        .btn-auth.btn-reset:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 25px rgba(245, 158, 11, 0.3);
        }
        .btn-auth:disabled { opacity: 0.6; cursor: not-allowed; transform: none !important; }
        .alert-message {
            padding: 0.5rem 1rem;
            border-radius: 10px;
            margin-bottom: 0.8rem;
            font-size: 0.85rem;
            display: none;
        }
        .alert-message.show { display: block; }
        .alert-message.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #f87171;
        }
        .alert-message.success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            color: #4ade80;
        }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 0.5rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #7a6a94;
            cursor: pointer;
            background: transparent;
            border: none;
            font-size: 1rem;
        }
        .password-toggle:hover { color: #b8aad0; }
        .position-relative { position: relative; }
        .toast-notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            z-index: 10001;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            font-weight: 600;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        .toast-notification.show { transform: translateY(0); opacity: 1; }
        .toast-notification.error { background: linear-gradient(135deg, #ef4444, #dc2626); }
        @media (max-width: 480px) { .auth-card { padding: 1.2rem; } }
    </style>
</head>
<body>
    <div id="toast" class="toast-notification"></div>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <h2>🔑 Reset <span>Password</span></h2>
                <p>Enter your new password below</p>
            </div>

            <div id="alertMessage" class="alert-message"></div>

            <form id="resetForm" onsubmit="resetPassword(event)">
                <div class="mb-3">
                    <label class="form-label"><i class="fas fa-envelope"></i> Email Address</label>
                    <input type="email" class="form-control" id="resetEmail" placeholder="institution@email.com" readonly style="opacity: 0.7;">
                </div>
                <div class="mb-3 position-relative">
                    <label class="form-label"><i class="fas fa-lock"></i> New Password *</label>
                    <input type="password" class="form-control" id="newPassword" placeholder="Min 6 characters" minlength="6" required>
                    <button type="button" class="password-toggle" onclick="togglePassword('newPassword', this)">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <div class="mb-3 position-relative">
                    <label class="form-label"><i class="fas fa-lock"></i> Confirm Password *</label>
                    <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm your password" minlength="6" required>
                    <button type="button" class="password-toggle" onclick="togglePassword('confirmPassword', this)">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <button type="submit" class="btn-auth btn-reset" id="resetBtn">
                    <i class="fas fa-save"></i> Reset Password
                </button>
            </form>

            <div class="auth-divider mt-3">
                <span><a href="institution.html" style="color:#a87cdb;">Back to Sign In</a></span>
            </div>
        </div>
    </div>

    <script>
        var API_BASE = '/api';

        function showToast(message, isError) {
            isError = isError || false;
            var toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast-notification' + (isError ? ' error' : '');
            setTimeout(function() { toast.classList.add('show'); }, 10);
            setTimeout(function() { toast.classList.remove('show'); }, 4000);
        }

        function showAlert(message, type) {
            var alertEl = document.getElementById('alertMessage');
            alertEl.textContent = message;
            alertEl.className = 'alert-message show ' + type;
        }

        function hideAlert() {
            document.getElementById('alertMessage').className = 'alert-message';
        }

        function togglePassword(inputId, btn) {
            var input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                btn.innerHTML = '<i class="fas fa-eye-slash"></i>';
            } else {
                input.type = 'password';
                btn.innerHTML = '<i class="fas fa-eye"></i>';
            }
        }

        function getUrlParams() {
            var params = {};
            var query = window.location.search.substring(1);
            var pairs = query.split('&');
            for (var i = 0; i < pairs.length; i++) {
                var pair = pairs[i].split('=');
                if (pair.length === 2) {
                    params[decodeURIComponent(pair[0])] = decodeURIComponent(pair[1]);
                }
            }
            return params;
        }

        function resetPassword(event) {
            event.preventDefault();
            hideAlert();

            var params = getUrlParams();
            var email = document.getElementById('resetEmail').value.trim() || params.email || '';
            var code = params.code || '';
            var newPassword = document.getElementById('newPassword').value;
            var confirmPassword = document.getElementById('confirmPassword').value;
            var btn = document.getElementById('resetBtn');

            if (!email) {
                showAlert('Email address is required', 'error');
                return;
            }

            if (!code) {
                showAlert('Invalid reset link. Please request a new one.', 'error');
                return;
            }

            if (newPassword.length < 6) {
                showAlert('Password must be at least 6 characters long', 'error');
                return;
            }

            if (newPassword !== confirmPassword) {
                showAlert('Passwords do not match', 'error');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Resetting...';

            var data = {
                email: email,
                code: code,
                newPassword: newPassword
            };

            fetch(API_BASE + '/auth/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(function(response) {
                if (!response.ok) {
                    return response.json().then(function(errData) {
                        throw new Error(errData.error || 'Server error');
                    });
                }
                return response.json();
            })
            .then(function(result) {
                if (result.success) {
                    showAlert('✅ Password reset successfully!', 'success');
                    showToast('✅ Password reset successfully!');
                    setTimeout(function() {
                        window.location.href = 'institution.html';
                    }, 2000);
                } else {
                    showAlert(result.error || 'Failed to reset password', 'error');
                    showToast('❌ ' + (result.error || 'Failed to reset password'), true);
                }
            })
            .catch(function(error) {
                console.error('Reset error:', error);
                showAlert(error.message || 'An error occurred', 'error');
                showToast('❌ ' + (error.message || 'Failed to reset password'), true);
            })
            .finally(function() {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-save"></i> Reset Password';
            });
        }

        document.addEventListener('DOMContentLoaded', function() {
            var params = getUrlParams();
            if (params.email) {
                document.getElementById('resetEmail').value = params.email;
            }
            if (!params.code) {
                showAlert('Invalid reset link. Please request a new password reset.', 'error');
            }
        });
    </script>
</body>
</html>
