<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful - EDULINK</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #0e0a1a 0%, #1a142b 100%);
            min-height: 100vh;
            color: #f0ecf7;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .success-container {
            max-width: 600px;
            width: 100%;
        }

        .success-card {
            background: rgba(40, 30, 65, 0.35);
            border: 1px solid rgba(160, 120, 200, 0.08);
            border-radius: 24px;
            padding: 2.5rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .success-icon {
            font-size: 4rem;
            color: #4ade80;
            margin-bottom: 1rem;
            animation: bounceIn 0.6s ease;
        }

        @keyframes bounceIn {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.2); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); opacity: 1; }
        }

        .success-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #f0ecf7;
            margin-bottom: 0.5rem;
        }

        .success-subtitle {
            color: #b8aad0;
            font-size: 1rem;
            margin-bottom: 1.5rem;
        }

        .payment-details {
            background: rgba(12, 8, 24, 0.4);
            border-radius: 16px;
            padding: 1.2rem;
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .payment-details .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 0.4rem 0;
            border-bottom: 1px solid rgba(160, 120, 200, 0.05);
        }

        .payment-details .detail-row:last-child {
            border-bottom: none;
        }

        .payment-details .detail-label {
            color: #7a6a94;
            font-size: 0.85rem;
        }

        .payment-details .detail-value {
            color: #f0ecf7;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .payment-details .detail-value.amount {
            color: #4ade80;
            font-weight: 700;
            font-size: 1.1rem;
        }

        /* Next Steps Section */
        .next-steps {
            background: rgba(20, 14, 40, 0.5);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(160, 120, 200, 0.06);
        }

        .next-steps .steps-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #dac9f0;
            margin-bottom: 0.8rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            justify-content: center;
        }

        .next-steps .steps-title i {
            color: #a87cdb;
        }

        .step-item {
            display: flex;
            align-items: flex-start;
            gap: 0.8rem;
            padding: 0.6rem 0;
            border-bottom: 1px solid rgba(160, 120, 200, 0.04);
            text-align: left;
        }

        .step-item:last-child {
            border-bottom: none;
        }

        .step-number {
            width: 28px;
            height: 28px;
            background: rgba(130, 80, 190, 0.15);
            border: 1px solid rgba(170, 130, 220, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 600;
            color: #cfbcfa;
            flex-shrink: 0;
            margin-top: 0.1rem;
        }

        .step-content {
            flex: 1;
        }

        .step-content .step-title {
            color: #f0ecf7;
            font-weight: 500;
            font-size: 0.95rem;
        }

        .step-content .step-desc {
            color: #7a6a94;
            font-size: 0.8rem;
            margin-top: 0.1rem;
        }

        .step-content .step-desc strong {
            color: #b8aad0;
        }

        .institution-details {
            background: rgba(16, 185, 129, 0.05);
            border: 1px solid rgba(16, 185, 129, 0.1);
            border-radius: 12px;
            padding: 0.8rem 1rem;
            margin-top: 0.5rem;
        }

        .institution-details .inst-name {
            color: #4ade80;
            font-weight: 600;
        }

        .institution-details .inst-contact {
            color: #b8aad0;
            font-size: 0.85rem;
            margin-top: 0.2rem;
        }

        .institution-details .inst-contact i {
            margin-right: 0.5rem;
            color: #7a6a94;
        }

        .badge-type {
            display: inline-block;
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .badge-type.institution {
            background: rgba(60, 160, 220, 0.15);
            border: 1px solid rgba(60, 160, 220, 0.2);
            color: #8fcbff;
        }

        .badge-type.edulink {
            background: rgba(74, 222, 128, 0.15);
            border: 1px solid rgba(74, 222, 128, 0.2);
            color: #4ade80;
        }

        /* Buttons */
        .action-buttons {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 1rem;
        }

        .btn-action {
            padding: 0.7rem 1.5rem;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
        }

        .btn-action.primary {
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            color: white;
        }

        .btn-action.primary:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 25px rgba(124, 58, 237, 0.3);
        }

        .btn-action.secondary {
            background: rgba(40, 30, 65, 0.5);
            border: 1px solid rgba(160, 120, 200, 0.15);
            color: #b8aad0;
        }

        .btn-action.secondary:hover {
            background: rgba(60, 40, 90, 0.5);
            color: #f0ecf7;
        }

        .btn-action.success {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }

        .btn-action.success:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.3);
        }

        /* Toast */
        .toast-notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            z-index: 10001;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            font-weight: 600;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .toast-notification.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast-notification.error {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }

        /* Loading Spinner */
        .loading-spinner {
            text-align: center;
            padding: 2rem;
            color: #7a6a94;
        }

        .loading-spinner i {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            display: block;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 500px) {
            .success-card {
                padding: 1.5rem;
            }
            .success-title {
                font-size: 1.4rem;
            }
            .action-buttons {
                flex-direction: column;
            }
            .btn-action {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>

<body>
    <!-- Toast -->
    <div id="toast" class="toast-notification"></div>

    <div class="success-container">
        <div class="success-card" id="successCard">
            <!-- Loading State -->
            <div id="loadingState" class="loading-spinner">
                <i class="fas fa-spinner"></i>
                <p>Loading payment details...</p>
            </div>

            <!-- Success Content -->
            <div id="successContent" style="display: none;">
                <div class="success-icon">✅</div>
                <h1 class="success-title">Payment Successful!</h1>
                <p class="success-subtitle">Your course enrollment payment has been confirmed.</p>

                <!-- Payment Details -->
                <div class="payment-details" id="paymentDetails">
                    <!-- Rendered by JavaScript -->
                </div>

                <!-- Next Steps -->
                <div class="next-steps" id="nextSteps">
                    <!-- Rendered by JavaScript based on course type -->
                </div>

                <!-- Action Buttons -->
                <div class="action-buttons">
                    <a href="students.html" class="btn-action secondary">
                        <i class="fas fa-search"></i> Browse More Courses
                    </a>
                    <a href="wallet.html" class="btn-action primary">
                        <i class="fas fa-wallet"></i> Go to Wallet
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==============================================
        // TOAST NOTIFICATION
        // ==============================================
        function showToast(message, isError) {
            isError = isError || false;
            var toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast-notification' + (isError ? ' error' : '');
            setTimeout(function() { toast.classList.add('show'); }, 10);
            setTimeout(function() { toast.classList.remove('show'); }, 4000);
        }

        // ==============================================
        // GET URL PARAMETERS
        // ==============================================
        function getUrlParams() {
            var params = {};
            var query = window.location.search.substring(1);
            var pairs = query.split('&');
            for (var i = 0; i < pairs.length; i++) {
                var pair = pairs[i].split('=');
                if (pair.length === 2) {
                    params[decodeURIComponent(pair[0])] = decodeURIComponent(pair[1]);
                }
            }
            return params;
        }

        // ==============================================
        // GET COURSE DATA
        // ==============================================
        function getCourseData() {
            var storedCourse = localStorage.getItem('payment_course');
            if (storedCourse) {
                try {
                    return JSON.parse(storedCourse);
                } catch (e) {
                    console.error('Error parsing course data:', e);
                }
            }
            return null;
        }

        // ==============================================
        // RENDER PAYMENT SUCCESS
        // ==============================================
        function renderSuccess() {
            var course = getCourseData();
            var params = getUrlParams();
            var amount = params.amount || course?.price || 0;
            var paymentMethod = params.method || 'M-Pesa';

            if (!course) {
                // Try to get from localStorage
                var fallbackCourse = {
                    id: params.id || 'N/A',
                    name: params.name || 'Course Enrollment',
                    institution: params.institution || 'EDULINK',
                    hostedType: params.hostedType || 'institution',
                    price: parseFloat(amount) || 0,
                    description: 'Course enrollment payment'
                };
                course = fallbackCourse;
            }

            // Determine if hosted by EDULINK or Institution
            var isEdulinkHosted = course.hostedType === 'lanvai' || course.hostedType === 'edulink';
            var hostedType = isEdulinkHosted ? 'EDULINK Hosted' : 'Institution Hosted';
            var badgeClass = isEdulinkHosted ? 'edulink' : 'institution';
            var typeIcon = isEdulinkHosted ? '🚀' : '🏛️';

            // Format amount
            var formattedAmount = 'KES ' + (parseFloat(amount) || 0).toFixed(2);

            // Build payment details
            var paymentDetailsHtml = `
                <div class="detail-row">
                    <span class="detail-label">Course</span>
                    <span class="detail-value">${course.name || 'N/A'}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Institution</span>
                    <span class="detail-value">${course.institution || 'N/A'}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Amount Paid</span>
                    <span class="detail-value amount">${formattedAmount}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Payment Method</span>
                    <span class="detail-value">${paymentMethod}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Transaction Date</span>
                    <span class="detail-value">${new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Status</span>
                    <span class="detail-value" style="color:#4ade80;">✅ Completed</span>
                </div>
            `;

            document.getElementById('paymentDetails').innerHTML = paymentDetailsHtml;

            // Build next steps based on course type
            var nextStepsHtml = '';

            if (isEdulinkHosted) {
                // EDULINK Hosted - Contact bootcamp
                nextStepsHtml = `
                    <div class="steps-title">
                        <i class="fas fa-rocket"></i> Next Steps - EDULINK Hosted Course
                    </div>
                    <div style="text-align:center; margin-bottom:0.5rem;">
                        <span class="badge-type edulink">🚀 EDULINK Hosted</span>
                    </div>
                    <div class="step-item">
                        <div class="step-number">1</div>
                        <div class="step-content">
                            <div class="step-title">📧 Check Your Email</div>
                            <div class="step-desc">You will receive a confirmation email with course details and access information.</div>
                        </div>
                    </div>
                    <div class="step-item">
                        <div class="step-number">2</div>
                        <div class="step-content">
                            <div class="step-title">📞 Contact the Bootcamp</div>
                            <div class="step-desc">Reach out to <strong>${course.institution || 'the bootcamp'}</strong> to complete your enrollment and get started.</div>
                        </div>
                    </div>
                    <div class="step-item">
                        <div class="step-number">3</div>
                        <div class="step-content">
                            <div class="step-title">📚 Start Learning</div>
                            <div class="step-desc">Access course materials, join live sessions, and begin your learning journey!</div>
                        </div>
                    </div>
                    <div class="institution-details">
                        <div class="inst-name">📧 Contact: ${course.institution || 'EDULINK Support'}</div>
                        <div class="inst-contact">
                            <i class="fas fa-envelope"></i> ${course.email || 'support@edulink.com'}
                        </div>
                        <div class="inst-contact">
                            <i class="fas fa-phone"></i> ${course.phone || '+254 794914597'}
                        </div>
                    </div>
                `;
            } else {
                // Institution Hosted - Visit institution for admission
                nextStepsHtml = `
                    <div class="steps-title">
                        <i class="fas fa-university"></i> Next Steps - Institution Hosted Course
                    </div>
                    <div style="text-align:center; margin-bottom:0.5rem;">
                        <span class="badge-type institution">🏛️ Institution Hosted</span>
                    </div>
                    <div class="step-item">
                        <div class="step-number">1</div>
                        <div class="step-content">
                            <div class="step-title">📧 Check Your Email</div>
                            <div class="step-desc">You will receive a confirmation email with payment receipt and admission details.</div>
                        </div>
                    </div>
                    <div class="step-item">
                        <div class="step-number">2</div>
                        <div class="step-content">
                            <div class="step-title">🏛️ Visit the Institution</div>
                            <div class="step-desc">Go to <strong>${course.branch || course.address || 'the institution'}</strong> to complete your admission process.</div>
                        </div>
                    </div>
                    <div class="step-item">
                        <div class="step-number">3</div>
                        <div class="step-content">
                            <div class="step-title">📋 Complete Registration</div>
                            <div class="step-desc">Fill out admission forms, submit required documents, and confirm your enrollment.</div>
                        </div>
                    </div>
                    <div class="step-item">
                        <div class="step-number">4</div>
                        <div class="step-content">
                            <div class="step-title">🎓 Start Classes</div>
                            <div class="step-desc">Begin your academic journey at <strong>${course.institution || 'the institution'}</strong>!</div>
                        </div>
                    </div>
                    <div class="institution-details">
                        <div class="inst-name">📍 Location: ${course.address || course.branch || 'Nairobi, Kenya'}</div>
                        <div class="inst-contact">
                            <i class="fas fa-envelope"></i> ${course.email || 'admissions@' + (course.institution || 'institution').toLowerCase().replace(/\s/g, '') + '.com'}
                        </div>
                        <div class="inst-contact">
                            <i class="fas fa-phone"></i> ${course.phone || '+254 794914597'}
                        </div>
                    </div>
                `;
            }

            document.getElementById('nextSteps').innerHTML = nextStepsHtml;

            // Show content
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('successContent').style.display = 'block';

            // Show toast
            showToast('✅ Payment successful! Check your email for confirmation.');
        }

        // ==============================================
        // INITIALIZE
        // ==============================================
        document.addEventListener('DOMContentLoaded', function() {
            renderSuccess();

            // Store payment in history
            var course = getCourseData();
            if (course) {
                var paymentHistory = JSON.parse(localStorage.getItem('payment_history') || '[]');
                paymentHistory.push({
                    course_id: course.id,
                    course_name: course.name,
                    institution: course.institution,
                    amount: course.price || 0,
                    currency: 'KES',
                    date: new Date().toISOString(),
                    status: 'completed'
                });
                localStorage.setItem('payment_history', JSON.stringify(paymentHistory));
            }

            // Clear payment course data from localStorage
            localStorage.removeItem('payment_course');
        });

        // ==============================================
        // TRACKING
        // ==============================================
        (function() {
            var visitorId = localStorage.getItem('visitor_id');
            if (!visitorId) {
                visitorId = 'visitor_' + Math.random().toString(36).substring(2, 18);
                localStorage.setItem('visitor_id', visitorId);
            }

            function trackPageView() {
                var data = {
                    pageUrl: window.location.pathname || '/',
                    pageTitle: document.title || 'Unknown Page',
                    referrerUrl: document.referrer || ''
                };
                fetch('/api/track/pageview', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                }).catch(function() {});
            }

            trackPageView();
        })();
    </script>
</body>

</html>
